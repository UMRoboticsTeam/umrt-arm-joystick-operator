joy_node:
  # See documentation https://docs.ros.org/en/humble/p/joy/__README.html#parameters
  ros__parameters:
    device_id: 0
    device_name: ""
    deadzone: 0.05
    autorepeat_rate: 20.0
    sticky_buttons: false
    coalesce_interval_ms: 1


